name: web-ci

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Skip when web/ is absent
        if: hashFiles('web/pnpm-lock.yaml') == ''
        working-directory: .
        run: echo "web/ not present on this ref; skipping web checks."
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: hashFiles('web/pnpm-lock.yaml') != ''
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('web/pnpm-lock.yaml') != ''
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: pnpm typecheck
      - name: Lint
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: pnpm lint
      - name: Test
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: pnpm test
      # 生产构建必须设 VITE_API_BASE 或显式 VITE_USE_MOCK=1；CI 只做检查（及布局 e2e），用 mock 构建
      - name: Build
        if: hashFiles('web/pnpm-lock.yaml') != ''
        env:
          VITE_USE_MOCK: '1'
        run: pnpm build
      - name: Build guard (no VITE_API_BASE / VITE_USE_MOCK must fail)
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: |
          if pnpm exec vite build --outDir "$RUNNER_TEMP/guard-dist" > guard.log 2>&1; then
            echo "::error::production build without VITE_API_BASE should fail"; exit 1
          fi
          grep -q 'VITE_API_BASE=/' guard.log && echo "guard ok"
