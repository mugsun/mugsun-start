name: web-ci

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, test, build & e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip when web/ is absent
        if: hashFiles('web/pnpm-lock.yaml') == ''
        working-directory: .
        run: echo "web/ not present on this ref; skipping web checks."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: hashFiles('web/pnpm-lock.yaml') != ''
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('web/pnpm-lock.yaml') != ''
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: pnpm typecheck
      - name: Lint
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: pnpm lint
      - name: Test
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: pnpm test
      # 任何构建（含 staging）必须设 VITE_API_BASE 或显式 VITE_USE_MOCK=1；CI 只做检查（及布局 e2e），用 mock 构建
      - name: Build
        if: hashFiles('web/pnpm-lock.yaml') != ''
        env:
          VITE_USE_MOCK: '1'
        run: pnpm build
      - name: Build guard (no VITE_API_BASE / VITE_USE_MOCK must fail, any mode)
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: |
          check_guard() {
            local label="$1"; shift
            if pnpm exec vite build "$@" --outDir "$RUNNER_TEMP/guard-dist" > guard.log 2>&1; then
              cat guard.log
              echo "::error::${label} build without VITE_API_BASE / VITE_USE_MOCK should fail"; exit 1
            fi
            if ! grep -q 'VITE_API_BASE=/' guard.log; then
              cat guard.log
              echo "::error::${label} build failed, but not with the API base guard message"; exit 1
            fi
            echo "guard ok (${label})"
          }
          check_guard production
          check_guard staging --mode staging
      # 布局 e2e（提示遮挡/按钮等宽等），走前端 mock，不依赖后端；构建产物用 vite preview 提供，比 dev server 稳定
      - name: Playwright version
        id: pw
        if: hashFiles('web/pnpm-lock.yaml') != ''
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        if: hashFiles('web/pnpm-lock.yaml') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright chromium
        if: hashFiles('web/pnpm-lock.yaml') != '' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: hashFiles('web/pnpm-lock.yaml') != '' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: E2E (layout)
        if: hashFiles('web/pnpm-lock.yaml') != ''
        env:
          BASE: http://127.0.0.1:3093
        run: pnpm e2e:ci
      - name: Upload e2e artifacts
        if: failure() && hashFiles('web/pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: web/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
