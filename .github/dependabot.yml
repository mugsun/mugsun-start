# GitHub Actions 已全部钉到 commit SHA（#6）；由 Dependabot 每周检查新版本并提 PR，同时更新 SHA 和版本注释。server/ 的 Maven 依赖同样每周检查。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      # 小版本与补丁合成一个 PR；大版本单独一个 PR，便于逐个核对破坏性变更
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: ci

  # server/ 的 Maven 依赖（Spring Boot 父 POM、initializr BOM 等）。web/（npm）等 #3 合并后再加。
  - package-ecosystem: maven
    directory: /server
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # initializr 的小版本、大版本都可能改生成器 API，只收补丁；Spring Boot 大版本（4.x）要手工评估，不自动提
    ignore:
      - dependency-name: "io.spring.initializr:*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - version-update:semver-major
    groups:
      # Spring Boot 与 initializr 一起升（initializr 跟随 Boot 发版）：Boot 收小版本与补丁，initializr 只收补丁（见上方 ignore）
      spring-boot-and-initializr:
        patterns:
          - "org.springframework.boot:spring-boot*"
          - "io.spring.initializr:*"
        update-types:
          - minor
          - patch
      # 所有大版本升级单独成组，不与日常升级混在一起
      major:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: build
