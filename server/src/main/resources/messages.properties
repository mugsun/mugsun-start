# 统一错误文案（中文，缺省语言）。风格：书面语，不用感叹号（设计规格 §7）。
error.INVALID_PARAMETER=请求参数不符合要求，请检查标出的字段。
error.UNKNOWN_DEPENDENCY=未知的模块：{0}。
error.UNSUPPORTED_OPTION=一期不支持该选项：{0}。
error.DEPENDENCY_NOT_APPLICABLE=所选模块不适用于当前生成范围：{0}。
error.DEPENDENCY_CONFLICT=所选模块之间存在冲突：{0}。
error.DEPENDENCY_REQUIRES=所选模块缺少必需的模块：{0}。
error.NOT_FOUND=请求的地址不存在。
error.METHOD_NOT_ALLOWED=不支持该请求方法。
error.NOT_ACCEPTABLE=无法按请求的格式返回结果，请接受 JSON 格式的响应。
error.UNSUPPORTED_MEDIA_TYPE=不支持该请求体格式。
error.RATE_LIMITED=请求过于频繁，请在 {0} 秒后重试。
error.GENERATION_FAILED=生成失败，请稍后重试。反馈问题时请附上请求编号。
error.INTERNAL_ERROR=服务暂时出现问题，请稍后重试。反馈问题时请附上请求编号。
error.TEMPLATE_UNAVAILABLE=模板暂不可用，请稍后重试。

detail.required=此项为必填项。
detail.maxLength=最长 {0} 个字符。
detail.pattern=格式不正确。
detail.unsupported=一期不支持取值 {0}。
detail.unknown=未知的模块 {0}。
detail.notApplicable=模块 {0} 不适用于生成范围 {1}。
detail.requires=模块 {0} 需要同时选择 {1}。
detail.conflicts=模块 {0} 与 {1} 不能同时选择。
detail.invalid=请求参数不正确。
detail.groupId.required=Group 为必填项。
detail.groupId.pattern=Group 只能包含小写字母、数字、下划线和点，且不能以数字开头。
detail.artifactId.required=Artifact 为必填项。
detail.artifactId.pattern=Artifact 只能包含小写字母、数字和连字符，且须以字母开头，最长 50 个字符。
detail.artifactId.maxLength=Artifact 只能包含小写字母、数字和连字符，且须以字母开头，最长 50 个字符。
detail.name.required=项目名称为必填项，最长 50 个字符。
detail.name.maxLength=项目名称为必填项，最长 50 个字符。
detail.packageName.pattern=包名须由小写字母、数字和下划线组成的段以点连接，各段不能以数字开头。
detail.packageName.keyword=包名中的 {0} 是 Java 关键字或保留字面量，不能用作包名的一段。
detail.description.maxLength=描述最长 200 个字符。
detail.version.pattern=版本号只能包含字母、数字、点、下划线和连字符，最长 50 个字符。
detail.baseDir.pattern=根目录名只能包含字母、数字、点、下划线和连字符，最长 64 个字符。
detail.body.invalid=请求体不是有效的 JSON，或字段类型不正确。
