<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>start.mugsun.com</title>
    <script>
      // 首帧前应用深浅色，避免闪烁（与 useDark 的 storageKey 一致）
      try {
        var s = localStorage.getItem('start-mugsun-theme')
        if (s === 'dark' || ((!s || s === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
        // 手动选亮色时加 .light（与 App.vue useDark 的 valueLight 一致），让不依赖应用的样式（如启动错误页）能区分「手动亮色」与「跟随系统」
        else if (s === 'light') document.documentElement.classList.add('light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
